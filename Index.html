<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortune Tiger 2500x</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black}
body{background:radial-gradient(#ff6a00,#000);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:10px}
.box{width:100%;max-width:380px;background:#000;border:4px solid gold;border-radius:20px;padding:12px}
.top{display:flex;justify-content:space-between;color:gold;font-size:12px}
.pot{display:flex;justify-content:space-between;background:#111;border:1px solid gold;border-radius:8px;padding:6px;margin:8px 0;font-size:10px;color:#fff}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#000;padding:8px;border-radius:14px;border:2px solid gold;height:285px}
.col{overflow:hidden;background:linear-gradient(#fff,#ccc);border-radius:10px;display:flex;flex-direction:column}
.sym{height:95px;display:flex;align-items:center;justify-content:center;font-size:46px}
.win{text-align:center;font-size:22px;height:35px;color:#0f0;margin:8px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{padding:12px;border:none;border-radius:10px;font-weight:900}
.spin{background:linear-gradient(gold,orange);grid-column:span 2;font-size:22px}
.bet{background:#222;color:#fff;border:1px solid gold}
</style>
</head>
<body>
<div class="box">
<div class="top"><span>BAL $<b id="bal">5000</b></span><span>BET $<b id="bet">10</b></span></div>
<div class="pot"><span>10x</span><span>25x</span><span>100x</span><span><b>500x</b></span><span style="color:gold">2500x!</span></div>
<div class="reels"><div class="col" id="c0"></div><div class="col" id="c1"></div><div class="col" id="c2"></div></div>
<div class="win" id="win"></div>
<div class="btns"><button class="btn bet" onclick="chg(-1)">BET -</button><button class="btn bet" onclick="chg(1)">BET +</button><button class="btn spin" onclick="spin()">SPIN 🐯</button></div>
<div style="text-align:center;font-size:8px;color:#888;margin-top:6px">3 VERTICAL LINES • TIGER 10x TO 2500x</div>
</div>
<script>
let SYM=['🐯','💰','🧧','💵','🍊','🔔'],bal=5000,bet=10,spinning=false;
function fill(){for(let i=0;i<3;i++){let c=document.getElementById('c'+i);c.innerHTML='';for(let r=0;r<3;r++){let d=document.createElement('div');d.className='sym';d.textContent=SYM[Math.floor(Math.random()*6)];c.appendChild(d);}}}
fill();
function chg(d){if(spinning)return;bet=Math.max(5,Math.min(200,bet+d*5));document.getElementById('bet').textContent=bet}
function spin(){if(spinning)return;if(bal<bet){document.getElementById('win').textContent='NO MONEY';return;}spinning=true;bal-=bet;document.getElementById('bal').textContent=bal;document.getElementById('win').textContent='';
let cols=[0,1,2].map(i=>document.getElementById('c'+i));
cols.forEach(col=>{col.innerHTML='<div class="sym">🐯</div><div class="sym">💰</div><div class="sym">🧧</div>';});
setTimeout(()=>{let res=[[],[],[]];for(let c=0;c<3;c++){let col=document.getElementById('c'+c);col.innerHTML='';for(let r=0;r<3;r++){let s=SYM[Math.floor(Math.random()*6)];if(Math.random()<0.25)s='🐯';res[c][r]=s;let d=document.createElement('div');d.className='sym';d.textContent=s;col.appendChild(d);}}
let wins=[[ [0,0],[1,0],[2,0] ],[ [0,1],[1,1],[2,1] ],[ [0,2],[1,2],[2,2] ],[ [0,0],[0,1],[0,2] ],[ [1,0],[1,1],[1,2] ],[ [2,0],[2,1],[2,2] ]];let maxM=0;
wins.forEach(l=>{let a=res[l[0][0]][l[0][1]],b=res[l[1][0]][l[1][1]],c=res[l[2][0]][l[2][1]];if(a===b&&b===c){if(a==='🐯'){let t=[10,25,100,500,2500];maxM=Math.max(maxM,t[Math.floor(Math.random()*t.length)]);}else if(a==='💰')maxM=Math.max(maxM,8);else maxM=Math.max(maxM,3);}});
if(maxM>0){let w=bet*maxM;bal+=w;document.getElementById('bal').textContent=bal;document.getElementById('win').textContent=maxM>=100?`🐯 MEGA ${maxM}X $${w}!`:`WIN ${maxM}X $${w}`;if(navigator.vibrate)navigator.vibrate([80,30,120]);}else document.getElementById('win').textContent='TRY AGAIN';spinning=false;},900);}
</script>
</body>
                                                    </html>
